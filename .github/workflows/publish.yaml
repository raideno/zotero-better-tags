# trigger on version tag, automatically create a .xpi build and associate a release

name: Publish XPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Pack XPI
        run: npm run pack

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: plugin.xpi
